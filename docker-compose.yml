name: wukong-a2a-platform

# 日常部署模式：Docker 仅负责 Neo4j 与 Nginx。
# Go 后端由宿主机手动启动并监听 0.0.0.0:8088。
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: wukong-neo4j
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-star2026}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-star2026}"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$NEO4J_PASSWORD\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 35s

  nginx:
    image: nginx:1.27-alpine
    container_name: wukong-nginx
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5188}:80"
    volumes:
      # 将宿主机打包后的前端成果物直接映射给 Nginx。
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # Windows/macOS Docker Desktop 已内置该域名；此项同时兼容 Linux Docker。
      - "host.docker.internal:host-gateway"

volumes:
  neo4j_data:
  neo4j_logs:
